schema_version: 1
name: stage2-mock-smoke

workloads:
  - name: tiny-36-orbital-fixture
    fcidump: ../tests/fixtures/smoke/FCIDUMP
    adetfile: ../tests/fixtures/smoke/determinants.txt

candidates:
  - name: mock-success
    backend: mock
    mock_argv:
      - .venv/bin/python
      - tests/fixtures/mock_sbd.py
      - success
  - name: mock-nonconverged
    backend: mock
    mock_argv:
      - .venv/bin/python
      - tests/fixtures/mock_sbd.py
      - nonconverged
  - name: mock-failure
    backend: mock
    mock_argv:
      - .venv/bin/python
      - tests/fixtures/mock_sbd.py
      - fail
  - name: mock-timeout
    backend: mock
    mock_argv:
      - .venv/bin/python
      - tests/fixtures/mock_sbd.py
      - timeout
      - --sleep-seconds
      - "30"
      - --spawn-child
  - name: mock-oom
    backend: mock
    mock_argv:
      - .venv/bin/python
      - tests/fixtures/mock_sbd.py
      - oom

solver:
  method: 0
  iteration: 6
  block: 10
  tolerance: 1.0e-8
  max_time: 240
  bit_length: 20
  shuffle: 0
  carryover_ratio: 0.5
  rdm: 0
  adet_comm_size: 1
  bdet_comm_size: 1
  task_comm_size: 1

protocol:
  warmups: 0
  repetitions: 1
  timeout_s: 0.35
  seed: 1729
  purpose: test
  correctness_validated: false
