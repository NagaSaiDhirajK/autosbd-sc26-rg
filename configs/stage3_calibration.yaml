    backend: cpu
    executable: ../build/upstream/amd-729cfa3a-nvhpc-26.5/diag_cpu
    threads: 16
    mpi_ranks: 1
    compiler_flags:
      - -std=c++17
      - -O3
      - -tp=native
      - -mp
      - -DSBD_TRADMODE
      - -DUSE_DET_CACHE_OMP
      - -lopenblas
  - name: amd-l4-default
    backend: gpu
    executable: ../build/upstream/amd-729cfa3a-nvhpc-26.5/diag_gpu
    threads: 1
    mpi_ranks: 1
    compiler_flags:
      - -std=c++17
      - -O3
      - -tp=native
      - -mp=gpu
      - -gpu=cc89
      - -Minfo=mp
      - -DSBD_TRADMODE
      - -DUSE_GPU
      - -DUSE_DET_CACHE_OMP
      - -DUSE_HIJ_OMP_OFFLOAD
