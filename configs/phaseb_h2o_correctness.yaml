schema_version: 1
name: phaseb-amd-h2o-correctness

workloads:
  - name: h2o-official-1em3
    fcidump: ../external/riken-sbd/data/h2o/fcidump.txt
    adetfile: ../external/riken-sbd/data/h2o/h2o-1em3-alpha.txt

candidates:
  - name: amd-cpu-16
    backend: cpu
    executable: ../build/upstream/amd-729cfa3a-nvhpc-26.5/diag_cpu
    threads: 16
    mpi_ranks: 1
    compiler_flags:
      - -std=c++17
      - -O3
      - -tp=native
      - -mp
      - -DSBD_TRADMODE
      - -DUSE_DET_CACHE_OMP
      - -lopenblas
  - name: amd-l4-default
    backend: gpu
    executable: ../build/upstream/amd-729cfa3a-nvhpc-26.5/diag_gpu
    threads: 1
    mpi_ranks: 1
    compiler_flags:
      - -std=c++17
      - -O3
      - -tp=native
      - -mp=gpu
      - -gpu=cc89
      - -Minfo=mp
      - -DSBD_TRADMODE
      - -DUSE_GPU
      - -DUSE_DET_CACHE_OMP
      - -DUSE_HIJ_OMP_OFFLOAD
      - -lopenblas

solver:
  method: 0
  iteration: 6
  block: 10
  tolerance: 1.0e-8
  max_time: 240
  bit_length: 20
  shuffle: 0
  carryover_ratio: 0.5
  rdm: 0
  adet_comm_size: 1
  bdet_comm_size: 1
  task_comm_size: 1

protocol:
  warmups: 0
  repetitions: 1
  timeout_s: 300
  seed: 1729
  purpose: correctness
  correctness_validated: false
